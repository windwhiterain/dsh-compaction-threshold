# Wiring reference: the two rows and the preset swap.
#
# The plugin is a plain dependency, not a profile bundle (`dsh plugin add` prints
# `declares no dsh.bundle — installed as a plain dependency`). Both halves are
# therefore mounted by rows you add to the profile patch yourself.
#
# Order matters: a `link:` or git dependency is read at startup, so install first,
# edit the patch second, and restart the host last. Applying the preset swap
# before that restart leaves new sessions of the named presets mounting a row the
# running process cannot resolve.
#
#   dsh plugin --profile web add github:<owner>/dsh-compaction-threshold
#   (edit ~/.dsh/profiles/<profile>/cordis.patch.yml as below)
#   (restart the host)
#
# `node deploy/apply-web-wiring.mjs <patch> [--write]` applies steps 1-3
# structurally: it locates each preset by its `- id: preset-<name>` line, so it
# survives unrelated edits elsewhere in the patch.
#
# Rollback: restore the patch backup, then
# `dsh plugin --profile web remove dsh-compaction-threshold`, then restart.

# ── 1. host plane: the store, the projection, and the command ───────────────
# Add one `- insert:` list carrying the host row (or add the entry to an
# existing insert list). This row is also the one that declares `dsh.client`, so
# it is what loads the composer chip.
- insert:
    - id: compaction-threshold
      name: 'dsh-compaction-threshold'

# ── 2. agent plane: swap the backend inside each preset ─────────────────────
# In every preset that should become adjustable, inside its `compaction` group
# (`name: cordis:group`, `group: true`, `isolate: { compaction: true,
# toolResultPruner: true }`), replace the shipped backend row with the engine row
# and keep `command-compact` and `tool-result-pruner` as they are:
#
#   - id: compaction-threshold-engine
#     name: 'dsh-compaction-threshold/engine'
#
# The row accepts the same `Config` as the shipped backend, including
# `thresholdRatio`. Omit that field to follow the backend's own default (0.8,
# `DEFAULT_THRESHOLD_RATIO`); a session then starts at that value and keeps its
# own from the composer chip.
#
# The shipped row being replaced, for reference:
#
#   - id: compaction-basic
#     name: '@deepseek-ai/dsh-compaction-basic'

# ── 3. optional: source hot reload for this plugin ───────────────────────────
# File-level roots reload the host half without a restart (the browser half still
# needs a page refresh). `base` must be an ancestor of every root; a root outside
# it is silently ignored, and a non-`file://` base fails activation.
#
#   - id: hmr
#     name: '@deepseek-ai/dsh-hmr'
#     config:
#       base: 'file:///C:/resource'
#       root:
#         - 'C:/resource/dsh-compaction-threshold/index.js'
#         - 'C:/resource/dsh-compaction-threshold/engine.js'
#         - 'C:/resource/dsh-compaction-threshold/lib/policy.js'
#         - 'C:/resource/dsh-compaction-threshold/client.js'
#
# After adding roots, touch the files once: the watcher reacts to a change, and
# the modules already loaded in the running process are not new.
